name: Release

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set the version from the release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
