name: Release

on:
  release:
    types: [published]

jobs:
  test:
    uses: ./.github/workflows/test.yml

  publish:
    needs: test
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Set the version from the release tag
        run: uv version --frozen "${GITHUB_REF_NAME#v}"

      - name: Build
        run: uv build

      - name: Publish to PyPI
        run: uv publish
